<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>Threads 인증 코드</title>
<style>
  :root { --bg:#fff; --fg:#111; --muted:#666; --box:#f3f3f3; --line:#ccc; --ok:#0a7d32; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111; --fg:#eee; --muted:#aaa; --box:#222; --line:#444; --ok:#4cc27a; }
  }
  body { font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif; max-width:560px; margin:40px auto; padding:0 16px; background:var(--bg); color:var(--fg); line-height:1.6; }
  h1 { font-size:1.4rem; }
  code { display:block; word-break:break-all; background:var(--box); padding:12px; border-radius:8px; margin:12px 0; font-size:.95rem; }
  button { padding:10px 16px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--fg); cursor:pointer; font-size:1rem; }
  .muted { color:var(--muted); font-size:.9rem; }
  .ok { color:var(--ok); margin-left:8px; }
</style>
</head>
<body>
<h1>Threads 인증 코드</h1>
<p id="msg">주소에 code가 없습니다. Threads 권한 허용 후 이 페이지로 돌아오면 코드가 표시됩니다.</p>
<code id="code" hidden></code>
<button id="copy" hidden>복사</button><span id="copied" class="ok" hidden>복사됨</span>
<p class="muted">이 페이지는 코드를 화면에만 표시하며 어디로도 전송하지 않습니다. 앱 시크릿과 토큰은 여기에 입력하지 마세요.</p>
<script>
  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  const error = params.get('error_description') || params.get('error');
  const msg = document.getElementById('msg');

  if (code) {
    const el = document.getElementById('code');
    el.textContent = code.replace(/#_$/, '');
    el.hidden = false;
    document.getElementById('copy').hidden = false;
    msg.textContent = '아래 코드를 복사해서 바로 토큰 교환에 쓰세요. (한 번만 사용 가능, 금방 만료)';
    document.getElementById('copy').onclick = async () => {
      try {
        await navigator.clipboard.writeText(el.textContent);
        document.getElementById('copied').hidden = false;
      } catch (e) {
        const range = document.createRange();
        range.selectNodeContents(el);
        const sel = getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        msg.textContent = '자동 복사가 안 돼서 코드를 선택해 뒀어요. Ctrl+C로 복사하세요.';
      }
    };
    history.replaceState(null, '', location.pathname);
  } else if (error) {
    msg.textContent = '인증 실패: ' + error;
  }
</script>
</body>
</html>
